<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Notes</title>
<style>
  :root {
    --bg: #0e1118;
    --surface: #151b26;
    --surface2: #1e2635;
    --border: #273043;
    --text: #d8dff0;
    --muted: #8b97b3;
    --accent: #6fa8ff;
    --green: #7fd98a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: linear-gradient(180deg, #11151f 0%, #0b0e15 100%);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 28px 16px 56px;
  }
  header { margin-bottom: 6px; }
  header h1 { font-size: 24px; letter-spacing: .01em; color: #eef2fb; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .day-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--accent);
    margin: 24px 0 10px;
  }
  .note {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .note.done { border-left-color: var(--green); opacity: .62; }
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .subject { font-weight: 700; font-size: 15px; color: #eef2fb; }
  .room, .time {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--surface2);
    color: var(--muted);
  }
  .done-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(127, 217, 138, .14);
    color: var(--green);
  }
  .text { font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .note.done .text { text-decoration: line-through; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 34px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>School <span>Notes</span></h1>
    <p id="updated"></p>
  </header>
  <main id="content"></main>
  <footer>Automatically synced from my school notes.</footer>
</div>
<script>
  const MONTHS = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  function fmtLong(iso) {
    const d = new Date(iso + "T00:00:00");
    return DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }

  // Cache-bust so the freshest data always loads (Pages serves max-age=600)
  fetch("data.json?v=" + Date.now())
    .then(r => r.json())
    .then(render)
    .catch(() => {
      document.getElementById("content").innerHTML =
        '<div class="empty">No notes available yet.</div>';
    });

  function render(data) {
    let items = (data && data.items) ? data.items.slice() : [];
    const updated = (data && data.updated) ? new Date(data.updated).toLocaleString() : new Date().toLocaleString();
    document.getElementById("updated").textContent = "Updated " + updated;

    const content = document.getElementById("content");
    if (!items.length) {
      content.innerHTML = '<div class="empty">No notes yet.</div>';
      return;
    }

    items.sort((a, b) => a.date === b.date ? b.startSec - a.startSec : (a.date < b.date ? 1 : -1));

    let html = "";
    let curDate = null;
    let idx = 0;
    items.forEach(it => {
      if (it.date !== curDate) {
        curDate = it.date;
        html += '<div class="day-label">' + fmtLong(it.date) + '</div>';
      }
      const done = it.done === true;
      html += '<div class="note' + (done ? " done" : "") + '" data-i="' + idx + '">' +
              '<div class="meta">' +
              (it.subject ? '<span class="subject"></span>' : '') +
              (it.room ? '<span class="room"></span>' : '') +
              '<span class="time"></span>' +
              (done ? '<span class="done-badge">Finished</span>' : '') +
              '</div><div class="text"></div></div>';
      idx++;
    });
    content.innerHTML = html;

    document.querySelectorAll(".note").forEach(n => {
      const it = items[parseInt(n.dataset.i, 10)];
      if (it.subject) n.querySelector(".subject").textContent = it.subject;
      if (it.room) n.querySelector(".room").textContent = "l" + it.room;
      n.querySelector(".time").textContent = it.time;
      n.querySelector(".text").textContent = it.text;
    });
  }
</script>
</body>
</html>
